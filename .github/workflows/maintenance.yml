name: Dalamud release maintenance

on:
  schedule:
    - cron: '7 */8 * * *' # Check stable releases every 8 hours: 00:07, 08:07, 16:07 UTC.
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build against stable Dalamud without publishing or opening issues
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-dof-maintenance
  cancel-in-progress: false

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.detect.outputs.needed }}
      build_candidate: ${{ steps.detect.outputs.build_candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Check stable Dalamud release
        id: detect
        shell: pwsh
        env:
          FORCE_CHECK: ${{ inputs.validate_only || false }}
        run: ./scripts/Check-Update.ps1 -ForceCheck:($env:FORCE_CHECK -eq 'true')
  maintain:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    permissions:
      contents: write
      issues: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 (Node.js 24)
        if: needs.detect.outputs.build_candidate == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Test maintenance decisions
        shell: pwsh
        run: ./scripts/Test-Maintenance.ps1
      - name: Check, build and publish compatible revisions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: ./scripts/Maintain.ps1 -ValidateOnly:($env:VALIDATE_ONLY -eq 'true')
