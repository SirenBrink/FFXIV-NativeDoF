name: Dalamud release maintenance

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # Check stable releases every 15 minutes, off the hour.
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build against stable Dalamud without publishing or opening issues
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-dof-maintenance
  cancel-in-progress: false

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.detect.outputs.needed }}
      build_candidate: ${{ steps.detect.outputs.build_candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check stable Dalamud release
        id: detect
        shell: pwsh
        env:
          FORCE_CHECK: ${{ inputs.validate_only || false }}
        run: ./scripts/Check-Update.ps1 -ForceCheck:($env:FORCE_CHECK -eq 'true')
  maintain:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    permissions:
      contents: write
      issues: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: needs.detect.outputs.build_candidate == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Test maintenance decisions
        shell: pwsh
        run: ./scripts/Test-Maintenance.ps1
      - name: Check, build and publish compatible revisions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: ./scripts/Maintain.ps1 -ValidateOnly:($env:VALIDATE_ONLY -eq 'true')
